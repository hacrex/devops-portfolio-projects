name: CI Pipeline

on:
  push:
    branches: [main]
    paths:
      - '01-netflix-clone-k8s-devsecops/**'
  pull_request:
    branches: [main]
    paths:
      - '01-netflix-clone-k8s-devsecops/**'

env:
  JAVA_VERSION: '17'
  DOCKER_IMAGE: dockerhub-user/netflix-clone
  ECR_REPOSITORY: 123456789012.dkr.ecr.us-east-1.amazonaws.com/netflix-clone

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-netflix-clone-k8s-devsecops
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B clean verify

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: 01-netflix-clone-k8s-devsecops

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@v9
        with:
          path: 01-netflix-clone-k8s-devsecops
          format: HTML
          args: >-
            --failOnCVSS 7
            --enableExperimental

      - name: Upload Dependency-Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: 01-netflix-clone-k8s-devsecops/dependency-check-report.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: 01-netflix-clone-k8s-devsecops
          push: false
          load: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Trivy scan results
        uses: aquasecurity/trivy-action@0.24.0
        if: always()
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Push to DockerHub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: 01-netflix-clone-k8s-devsecops
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push to Amazon ECR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY
          docker tag $DOCKER_IMAGE:$GITHUB_SHA $ECR_REPOSITORY:$GITHUB_SHA
          docker push $ECR_REPOSITORY:$GITHUB_SHA

      - name: Update Kubernetes manifests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sed -i "s|dockerhub-user/netflix-clone:COMMIT_SHA|${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update image tag to ${{ github.sha }}"
          git push
