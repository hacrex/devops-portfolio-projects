apiVersion: v1
kind: ResourceQuota
metadata:
  name: youtube-clone-quota
  namespace: prod
  labels:
    app.kubernetes.io/name: youtube-clone
    app.kubernetes.io/part-of: youtube-clone
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
    persistentvolumeclaims: "5"
    configmaps: "10"
    secrets: "20"
