spring.application.name=capstone
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:capstone}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}

---
spring.config.activate.on-profile=dev
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.hacrex=DEBUG

---
spring.config.activate.on-profile=staging
spring.jpa.show-sql=false
logging.level.com.hacrex=INFO

---
spring.config.activate.on-profile=production
spring.jpa.show-sql=false
logging.level.com.hacrex=WARN
