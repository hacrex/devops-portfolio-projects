apiVersion: v1
kind: LimitRange
metadata:
  name: youtube-clone-limit-range
  namespace: prod
  labels:
    app.kubernetes.io/name: youtube-clone
    app.kubernetes.io/part-of: youtube-clone
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "4"
        memory: 4Gi
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi
      min:
        storage: 1Gi
